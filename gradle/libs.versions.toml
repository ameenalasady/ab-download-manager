[versions]
kotlin = "2.4.20"
kotlin-serialization = "1.11.0"
okhttp = "5.5.0"
okio = "3.18.2"
coroutines = "1.11.0"
arrow = "2.2.3"
jna = "5.19.1"
dbus-java = "5.2.0"
datetime = "0.8.0"
semver = "3.1.0"
kermit = "2.2.0"
ktor = "3.6.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
okhttp-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-coroutines = { module = "com.squareup.okhttp3:okhttp-coroutines", version.ref = "okhttp" }
okio-okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
semver = { module = "io.github.z4kn4fein:semver", version.ref = "semver" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
dbusJava-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbusJava-unixSocket = { module = "com.github.hypfvieh:dbus-java-transport-junixsocket", version.ref = "dbus-java" }
pluginKotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
pluginSerialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
arrow-optics = { module = "io.arrow-kt:arrow-optics", version.ref = "arrow" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-auth-core = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-apiKey = { module = "io.ktor:ktor-server-auth-api-key", version.ref = "ktor" }
